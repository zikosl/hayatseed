services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hayatseed
      POSTGRES_USER: hayatseed
      POSTGRES_PASSWORD: hayatseed_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hayatseed -d hayatseed"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://hayatseed:hayatseed_password@postgres:5432/hayatseed?schema=public
      JWT_SECRET: change-me-in-production
      PORT: 4000
      FRONTEND_ORIGIN: http://localhost:3000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:4000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
